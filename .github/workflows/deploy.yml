name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 打开 base=/myknowledge/，让 index.html 里的资源路径带上仓库名
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # 纯前端用 hash 路由，本来不需要 SPA fallback；这里只是兜底
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      # 走 gh-pages 分支而不是 Pages API：
      # 无需在仓库里预先开启 Pages，也绕开 GITHUB_TOKEN 不能建站点的限制
      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'deploy: ${{ github.sha }}'
          force_orphan: true
